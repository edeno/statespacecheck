# Run `uvx pre-commit install` once; then every commit runs these. `uvx
# pre-commit run --all-files` runs them by hand. CI runs the same tools directly.
ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "pre-commit: apply automatic fixes"
  autoupdate_commit_msg: "pre-commit: update hook versions"
  # pre-commit.ci has no uv environment for the local mypy hook; CI's quality
  # job runs mypy instead.
  skip: [mypy]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: '^examples/.*\.ipynb$'  # tutorials keep their rendered outputs
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: '^mkdocs\.yml$'  # mkdocs uses !!python/name tags
      - id: end-of-file-fixer
        exclude: '^(uv\.lock|.*\.ipynb)$'
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: '^(uv\.lock|.*\.ipynb)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # match ruff in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        exclude: '^(uv\.lock|.*\.ipynb)$'

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the uv environment)
        entry: uv run --no-sync mypy
        language: system
        pass_filenames: false
        files: '^(src/.*\.py|pyproject\.toml)$'
