name: CI

# The filename (ci.yml) and the `pypi` environment are what PyPI's trusted
# publisher is registered against; renaming either breaks publishing.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default (Scientific Python SPEC 8); the publish and release jobs
# elevate only the scopes they need.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes a running workflow; tags
# each get their own group, so a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
          persist-credentials: false
      # mypy targets Python 3.12: scipy-stubs uses PEP 695 `type` statements.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: Install the locked dev environment
        # Exactly the ruff and mypy versions that `uv run` and pre-commit use
        # locally, rather than whichever release is newest that day.
        run: uv sync --frozen
      - name: Run ruff formatting check
        run: uv run ruff format --check .
      - name: Run ruff linting
        run: uv run ruff check . --output-format=github
      - name: Run mypy type checking
        run: uv run mypy
      - name: Lint the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          persona: regular
          # The default uploads SARIF to code scanning, which needs
          # security-events: write and fails on pushes and tags without it
          # (findings then only upload, never fail the job). Annotations need
          # no extra permission, and findings fail the step.
          advanced-security: false
          annotations: true

  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Check the lockfile against pyproject.toml
        run: uv lock --check

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests with coverage
        run: pytest --cov-report=xml  # tests/ and the docstring examples in src/
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Execute the tutorial notebooks
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install nbconvert ipykernel jupytext
          for nb in examples/[0-9][0-9]_*.ipynb; do
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.kernel_name=python3 --output-dir "$RUNNER_TEMP" "$nb"
          done
      - name: Check each tutorial's .py and .ipynb agree
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python - <<'EOF'
          import pathlib

          import jupytext

          for script in sorted(pathlib.Path("examples").glob("[0-9][0-9]_*.py")):
              notebook = script.with_suffix(".ipynb")
              cells = [(c.cell_type, c.source) for c in jupytext.read(script).cells]
              nb_cells = [(c.cell_type, c.source) for c in jupytext.read(notebook).cells]
              assert cells == nb_cells, (
                  f"{script} and {notebook} differ; run: jupytext --sync {script}"
              )
          print("all tutorial pairs agree")
          EOF

  test-minimum-pins:
    # The matrix above tests with whatever pip resolves, usually the newest
    # releases; this job proves the declared floors work, on the oldest Python.
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the floors pyproject.toml declares
        # One resolver call, so a test dependency cannot silently upgrade a
        # pinned floor; a conflict fails the job instead. scipy 1.11.0 is
        # yanked, so 1.11.1 is the lowest release a `>=1.11.1` user resolves.
        run: |
          pip install numpy==1.26.0 scipy==1.11.1 matplotlib==3.8.0 \
            -e . pytest pytest-cov hypothesis
          pip check
      - name: Assert the floors were not upgraded
        run: |
          python - <<'EOF'
          import matplotlib, numpy, scipy
          got = (numpy.__version__, scipy.__version__, matplotlib.__version__)
          assert got == ("1.26.0", "1.11.1", "3.8.0"), got
          EOF
      - name: Run tests
        # pyproject.toml turns every warning into an error, but the old floor
        # releases emit their own deprecation warnings (matplotlib 3.8.0 with
        # a current pyparsing), which are not this package's to fix. Warnings
        # are disabled for this job only; the matrix keeps them as errors.
        run: pytest --no-cov -p no:warnings

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, lockfile, test, test-minimum-pins]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  test-package:
    name: Test ${{ matrix.package }} install
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        package: ["wheel", "sdist"]
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install wheel
        if: matrix.package == 'wheel'
        run: pip install dist/*.whl
      - name: Install sdist
        if: matrix.package == 'sdist'
        run: pip install dist/*.tar.gz
      - name: Check installed dependencies
        run: pip check
      - name: Smoke-test the installed package
        # the per-event diagnostics end to end, with the values from the
        # event_diagnostics docstring
        run: |
          python - <<'EOF'
          import numpy as np
          import statespacecheck as ssc

          print("Version:", ssc.__version__)
          assert ssc.__version__ != "0.0.0"
          predictive = np.array([[0.7, 0.2, 0.1], [0.1, 0.2, 0.7]])
          fields = np.array([[5.0, 0.1], [1.0, 1.0], [0.1, 5.0]])
          result = ssc.event_diagnostics(predictive, fields, np.array([0, 1]), np.array([0, 0]))
          np.testing.assert_allclose(result.predictive_pvalue, [1.0, 0.172], atol=1e-3)
          print("smoke test passed")
          EOF

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # `environment: pypi` is the hook for a protected environment (SPEC 8);
    # configure required reviewers on it in the repo's Settings -> Environments
    # so a publish needs manual approval.
    environment:
      name: pypi
      url: https://pypi.org/project/statespacecheck/
    permissions:
      id-token: write  # Trusted publishing (OIDC) + attestation signing
      attestations: write  # Build-provenance attestations (SPEC 8)
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Upload PEP 740 attestations to PyPI alongside the artifacts.
          attestations: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # the section between this version's header and the next header
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf 'Release %s\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.\n' "$TAG" > release_notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file release_notes.md
