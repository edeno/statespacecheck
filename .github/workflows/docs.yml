name: docs

on:
  push:
    branches:
      - main
  # Every pull request: the site draws on docs/, the docstrings, the example
  # notebooks, and sections of README.md and CONTRIBUTING.md, and a build takes
  # seconds.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; the deploy job elevates only what Pages needs.
permissions:
  contents: read

# Builds are grouped per branch or pull request, so a pull request never cancels a
# queued build of main; a new push to a pull request cancels its older build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: Execute the tutorial notebooks
        run: >-
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed"
          examples/[0-9][0-9]_*.ipynb

      - name: Check the tutorials' pairs and committed outputs
        # The site shows the committed outputs; see docs/check_tutorials.py
        run: python docs/check_tutorials.py "$RUNNER_TEMP/executed"

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deployment at a time; a deployment in progress is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write  # to deploy to Pages
      id-token: write  # to verify the deployment's origin
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
