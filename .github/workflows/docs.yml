name: docs

on:
  push:
    branches:
      - main
  # Every pull request: the site draws on docs/, the docstrings, the example
  # notebooks, and sections of README.md and CONTRIBUTING.md, and a build takes
  # seconds.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; the deploy job elevates only what Pages needs.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: Execute the tutorial notebooks
        # The site shows the notebooks' committed outputs; this proves they run.
        run: >-
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP"
          examples/[0-9][0-9]_*.ipynb

      - name: Check each tutorial's .py and .ipynb agree
        run: |
          python - <<'EOF'
          from pathlib import Path

          import jupytext

          scripts = {p.stem for p in Path("examples").glob("[0-9][0-9]_*.py")}
          notebooks = {p.stem for p in Path("examples").glob("[0-9][0-9]_*.ipynb")}
          assert scripts and scripts == notebooks, f"unpaired tutorials: {scripts ^ notebooks}"
          for stem in sorted(scripts):
              script, notebook = Path(f"examples/{stem}.py"), Path(f"examples/{stem}.ipynb")
              cells = [(c.cell_type, c.source) for c in jupytext.read(script).cells]
              nb_cells = [(c.cell_type, c.source) for c in jupytext.read(notebook).cells]
              assert cells == nb_cells, (
                  f"{script} and {notebook} differ; run: "
                  f"uv run --extra docs jupytext --sync {script}"
              )
          print("all tutorial pairs agree")
          EOF

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write  # to deploy to Pages
      id-token: write  # to verify the deployment's origin
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
