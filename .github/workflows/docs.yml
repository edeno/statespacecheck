name: docs

on:
  push:
    branches:
      - main
  # Every pull request: the site draws on docs/, the docstrings, the example
  # notebooks, and sections of README.md and CONTRIBUTING.md, and a build takes
  # seconds.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; the deploy job elevates only what Pages needs.
permissions:
  contents: read

# Builds are grouped per branch or pull request, so a pull request never cancels a
# queued build of main; a new push to a pull request cancels its older build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: Execute the tutorial notebooks
        run: >-
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed"
          examples/[0-9][0-9]_*.ipynb

      - name: Check the committed notebook outputs are current
        # The site shows the committed outputs; their text must match a fresh run
        # (figures are not compared), and a fresh run must not warn.
        run: |
          python - "$RUNNER_TEMP/executed" <<'EOF'
          import sys
          from pathlib import Path

          import nbformat


          def text_outputs(path):
              cells = []
              for cell in nbformat.read(path, as_version=4).cells:
                  if cell.cell_type == "code":
                      cells.append([
                          (out.name, out.text) if out.output_type == "stream"
                          else ("result", out.data["text/plain"])
                          for out in cell.outputs
                          if out.output_type == "stream"
                          or ("text/plain" in out.get("data", {})
                              and not any(k.startswith("image/") for k in out.data))
                      ])
              return cells


          failures = []
          for committed in sorted(Path("examples").glob("[0-9][0-9]_*.ipynb")):
              executed = text_outputs(Path(sys.argv[1]) / committed.name)
              for index, outputs in enumerate(executed):
                  failures += [
                      f"{committed.name}, code cell {index}, warns: {text[:300]}"
                      for name, text in outputs if name == "stderr"
                  ]
              for index, (old, new) in enumerate(zip(text_outputs(committed), executed)):
                  if old != new:
                      failures.append(
                          f"{committed.name}, code cell {index}: committed output differs "
                          f"from a fresh run; re-execute the notebook\n{old}\n{new}"
                      )
          print("\n".join(failures) or "committed notebook outputs are current")
          sys.exit(bool(failures))
          EOF

      - name: Check each tutorial's .py and .ipynb agree
        run: |
          python - <<'EOF'
          from pathlib import Path

          import jupytext

          scripts = {p.stem for p in Path("examples").glob("[0-9][0-9]_*.py")}
          notebooks = {p.stem for p in Path("examples").glob("[0-9][0-9]_*.ipynb")}
          assert scripts and scripts == notebooks, f"unpaired tutorials: {scripts ^ notebooks}"
          for stem in sorted(scripts):
              script, notebook = Path(f"examples/{stem}.py"), Path(f"examples/{stem}.ipynb")
              cells = [(c.cell_type, c.source) for c in jupytext.read(script).cells]
              nb_cells = [(c.cell_type, c.source) for c in jupytext.read(notebook).cells]
              assert cells == nb_cells, (
                  f"{script} and {notebook} differ; run: "
                  f"uv run --extra docs jupytext --sync {script}"
              )
          print("all tutorial pairs agree")
          EOF

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deployment at a time; a deployment in progress is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write  # to deploy to Pages
      id-token: write  # to verify the deployment's origin
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
