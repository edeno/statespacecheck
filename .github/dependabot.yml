version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current; one grouped PR per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let a release age a week before proposing it (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # Keep uv.lock (the development and CI tool versions) current, monthly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
