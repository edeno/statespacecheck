version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current; one grouped PR per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let a release age a week before proposing it (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # Keep uv.lock (the development and CI tool versions) current, monthly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # Update only uv.lock: the lower bounds in pyproject.toml are the supported
    # minimums (tested by the CI floors job) and must not rise with each release.
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
