name: Feature request
description: A new diagnostic, option, or documentation
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The analysis or model you are working with, and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could statespacecheck support it?
