[project]
name = "statespacecheck"
dynamic = ["version"]
description = "Goodness-of-fit diagnostics for state space models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" },
    { name = "Sirui Zeng", email = "zengsr@bu.edu" },
    { name = "Uri T. Eden", email = "tzvi@bu.edu" },
]
keywords = [
    "neuroscience",
    "state-space-models",
    "goodness-of-fit",
    "bayesian",
    "diagnostics",
    "kalman-filter",
]
dependencies = ["numpy>=1.26.0", "scipy>=1.11.1", "matplotlib>=3.8.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://edeno.github.io/statespacecheck"
Documentation = "https://edeno.github.io/statespacecheck"
Repository = "https://github.com/edeno/statespacecheck"
Issues = "https://github.com/edeno/statespacecheck/issues"
Changelog = "https://github.com/edeno/statespacecheck/releases"

[project.optional-dependencies]
# `pip install -e .[dev]`. Keep `dev` identical to the `dev` dependency group
# below, which `uv sync` installs by default.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.16,<0.17",  # ruff format output is stable within a minor version
    "mypy>=1.13.0",
    "scipy-stubs",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-jupyter>=0.25.0",
    "jupytext>=1.16.0",
]

[dependency-groups]
# `uv sync` installs the package in editable mode plus this group; add
# `--extra docs` for the documentation. Keep identical to the `dev` extra above.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.13.0",
    "scipy-stubs",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27: PEP 639 License-Expression metadata by default
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/statespacecheck/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/conftest.py", "README.md", "LICENSE", "CITATION.cff",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/statespacecheck"]

[tool.ruff]
line-length = 95
force-exclude = true  # keep the excludes when an editor or script passes a file by name
extend-exclude = [
    "src/statespacecheck/_version.py",  # generated by hatch-vcs
    "docs/tutorials",  # symlinks to the example notebooks, linted there
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
    "ARG",  # unused arguments
    "EM",   # exception messages assigned before the raise
    "EXE",  # shebangs
    "FURB", # refurb modernizations
    "G",    # logging format
    "ICN",  # import conventions
    "ISC",  # implicit string concatenation
    "PERF", # performance anti-patterns
    "PGH",  # pygrep hooks (blanket noqa, type: ignore without code)
    "PIE",  # misc lints
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return statements
    "SIM",  # simplifications
    "T20",  # print statements
    "YTT",  # sys.version misuse
    "D",    # pydocstyle
]
ignore = [
    "E501",   # line length: ruff format wraps code; long strings and comments are allowed
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # test names document the tests
"examples/**/*.py" = [
    "D",     # Docstrings not needed in notebooks
    "T201",  # Examples print their results
    "E402",  # Module imports not at top - notebooks often have setup cells first
    "NPY002", # Legacy numpy random - acceptable in examples for simplicity
]
"examples/**/*.ipynb" = [
    "T201",  # Notebooks print their results
    "NPY002", # Legacy numpy random - acceptable in examples for simplicity
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8"
# src/ for the docstring examples
testpaths = ["tests", "src"]
pythonpath = ["tests"]  # test modules import the shared helpers module
addopts = [
    "-ra",
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
    "--cov",  # measures [tool.coverage.run] source
    "--cov-report=term-missing",
]
xfail_strict = true
log_level = "INFO"
# every warning is an error: a test that expects one says so with pytest.warns
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/statespacecheck"]
omit = ["*/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
files = ["src/statespacecheck"]
mypy_path = "src"
# Target 3.12: scipy-stubs (and its dependency optype) use PEP 695 `type`
# statements and require Python >= 3.12. Runtime 3.10 support is verified by
# the test matrix.
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.codespell]
skip = "uv.lock,*.ipynb,htmlcov,.venv,.mypy_cache,.ruff_cache,.pytest_cache,.hypothesis,.git,site,dist"
ignore-words-list = "bu"  # bu.edu email addresses
